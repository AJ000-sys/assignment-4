<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVmaze Show Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="site-header">
        <h1>TVmaze Show Gallery</h1>
        <form id="search-form">
            <label for="search-input">Search shows by title or keyword</label>
            <div class="search-row">
                <input type="text" id="search-input" name="q">
                <button type="submit">Search</button>
            </div>
        </form>
    </header>

    <main>
        <p id="status" aria-live="polite"></p>
        <section id="gallery" class="gallery" aria-label="Search results"></section>
    </main>

    <footer class="site-footer">
        <p>
            Data provided by <a href="https://www.tvmaze.com/" target="_blank" rel="noopener">TVmaze.com</a>,
            licensed under
            <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
            See the <a href="https://www.tvmaze.com/api#licensing" target="_blank" rel="noopener">TVmaze API licensing
                terms</a>.
        </p>
    </footer>

</body>

</html>
